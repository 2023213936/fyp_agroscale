<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroScale - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f7f4; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-container h2 {
            color: #2e7d32; 
            margin-bottom: 5px;
        }
        .login-container p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        /* Only User ID is uppercase for formatting consistency */
        #staffId {
            text-transform: uppercase;
        }
        .input-group input:focus {
            border-color: #2e7d32;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-login:hover {
            background-color: #1b5e20;
        }
        .error-message {
            color: #d32f2f;
            background-color: #fdecea;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 13px;
            border-left: 4px solid #d32f2f;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>AgroScale System</h2>
        <p>Cashier & Admin Portal</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error-message">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/" method="POST" autocomplete="off">
            <div class="input-group">
                <label for="staffId">User ID</label>
                <input type="text" id="staffId" name="staffId" required placeholder="e.g. A1001 or B1203" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="off">
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

</body>
</html>
